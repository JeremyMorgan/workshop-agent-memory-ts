# Local Neo4j for the workshop. Browser: http://localhost:7474  (neo4j / workshop-password)
services:
  neo4j:
    image: neo4j:5-community
    container_name: agent-memory-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/workshop-password
      NEO4J_PLUGINS: '["apoc"]'   # downloaded on first start; query_graph reads the schema with apoc.meta.schema()
      NEO4J_dbms_security_procedures_allowlist: "apoc.meta.*,apoc.version"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p workshop-password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  neo4j-data:
